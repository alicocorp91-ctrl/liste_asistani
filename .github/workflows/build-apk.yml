name: Android APK oluştur

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    name: Analiz + Test + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # steps.if, secrets bağlamını KULLANAMAZ (GitHub dokümanı) — bu yüzden
    # secret'lar job env'e alınır, koşul env üzerinden değerlendirilir.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter sürümü
        run: flutter --version

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: Kod analizi
        run: flutter analyze

      - name: Testleri çalıştır
        run: flutter test --timeout 120s

      # İsteğe bağlı imzalama: repo Secrets içinde KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS, KEY_PASSWORD tanımlıysa release anahtarıyla imzalanır;
      # tanımlı değilse debug anahtarıyla imzalanır (yine kurulabilir).
      - name: Release keystore hazırla (varsa)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<PROPS
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Release APK oluştur
        run: flutter build apk --release

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: liste-asistani-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
